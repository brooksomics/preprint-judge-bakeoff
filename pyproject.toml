[project]
name = "preprint-judge-bakeoff"
version = "0.1.0"
description = "Calibrate a cheap LLM preprint judge against a frontier-model ceiling via OpenRouter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=judge --cov=analyze --cov=fetch_preprints --cov-report=term-missing"
